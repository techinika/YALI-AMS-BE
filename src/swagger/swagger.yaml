  /api/organizations/ws/remove:
    delete:
      tags:
        - Organizations
      summary: Remove working sector from organization
      security:
        - bearerAuth: []
      parameters:
        - name: organizationId
          in: query
          schema:
            type: string
        - name: workingSectorId
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Working sector removed
        '401':
          description: Unauthorized
        '500':
          description: Server error

  /api/chat:
