          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - roleId
              properties:
                roleId:
                  type: integer
      responses:
        '200':
          description: Role changed
        '400':
          description: Missing required fields
        '401':
          description: Unauthorized
        '500':
          description: Server error

