      summary: Remove organization from user
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: query
          schema:
            type: string
        - name: organizationId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Organization removed
        '401':
          description: Unauthorized
        '500':
          description: Server error

  /api/users/import:
    post:
      tags:
        - Users
      summary: Import users
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - users
              properties:
                users:
                  type: array
                  items:
                    type: object
      responses:
        '200':
          description: Import successful
        '400':
          description: Invalid data
        '401':
          description: Unauthorized
        '500':
          description: Server error

  /api/users/role/{userId}:
