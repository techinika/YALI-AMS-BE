    post:
      tags:
        - Chat
      summary: Send message
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - receiverId
                - content
              properties:
                receiverId:
                  type: string
                content:
                  type: string
      responses:
        '200':
          description: Message sent
        '400':
          description: Missing required fields
        '401':
          description: Unauthorized
        '500':
