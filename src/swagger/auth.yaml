openapi: 3.0.0
info:
  title: YALI AMS API - Authentication
  version: 1.0.0
  description: Authentication endpoints for the Alumni Management System
paths:
  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  description: User email address
                password:
                  type: string
                  description: User password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  token:
                    type: string
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                      firstName:
                        type: string
                      lastName:
                        type: string
        '400':
          description: Missing required fields
        '401':
          description: Invalid credentials
        '500':
          description: Server error

  /api/auth/logout:
    post:
      tags:
        - Authentication
      summary: User logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout successful
        '401':
          description: Unauthorized
        '500':
          description: Server error

  /api/auth/change-pass:
    post:
      tags:
        - Authentication
      summary: Change password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPassword
                - newPassword
              properties:
                currentPassword:
                  type: string
                  description: Current password
                newPassword:
                  type: string
                  description: New password
      responses:
        '200':
          description: Password changed successfully
        '400':
          description: Missing required fields
        '401':
          description: Unauthorized
        '500':
          description: Server error

  /api/auth/request-link:
    post:
      tags:
        - Authentication
      summary: Request password reset link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  description: Email address to receive reset link
      responses:
        '200':
          description: Reset link sent
        '400':
          description: Email is required
        '500':
          description: Server error

  /api/auth/reset-password:
    post:
      tags:
        - Authentication
      summary: Reset password with token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - newPassword
              properties:
                token:
                  type: string
                  description: Password reset token
                newPassword:
                  type: string
                  description: New password
      responses:
        '200':
          description: Password reset successful
        '400':
          description: Token and new password are required
        '500':
          description: Server error